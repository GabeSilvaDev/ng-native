# Signal forms: a required field with a minimum length validates as it is typed, dropping nothing.
appId: dev.angularnative.canary
---
- runFlow:
    file: subflows/open.yaml
    env:
      SCREEN: Signal forms
- tapOn: 'name'
- inputText: 'ab'
- assertVisible: '1 validation error\(s\)'
- inputText: 'cdefgh'
- assertVisible: 'valid'
- assertVisible: '.*abcdefgh.*'
