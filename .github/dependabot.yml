version: 2
updates:
  # The workflows' actions, which pin versions and otherwise never move. One pull request for all
  # of them, once a month: each pull request is a CI run, and CI minutes are the budget.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # npm dependencies. Angular, React Native and Expo are left out: the Expo SDK decides React
  # Native's version (see ARCHITECTURE.md), and Angular moves in lockstep with the compiler this
  # project builds on, so those are upgraded deliberately rather than by a bot.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '@angular/*'
      - dependency-name: 'react-native'
      - dependency-name: 'react'
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      # Native libraries whose version the Expo SDK pins (`expo install` picks it), so they move
      # with the SDK rather than ahead of it.
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'
      - dependency-name: '@react-native-*/*'
      # Angular's compiler supports one TypeScript minor at a time, so TypeScript moves with Angular.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    # Two pull requests a month rather than one per package: the tooling, and everything else.
    groups:
      dev-tooling:
        dependency-type: development
      dependencies:
        dependency-type: production
